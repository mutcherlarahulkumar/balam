name: CI / Migrate & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.22"
  MIGRATE_VERSION: "v4.17.1"

jobs:
  build-and-test:
    name: Build & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

  migrate:
    name: Run Migrations
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install golang-migrate CLI
        run: |
          curl -sSL https://github.com/golang-migrate/migrate/releases/download/${{ env.MIGRATE_VERSION }}/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/migrate
          migrate -version

      - name: Resolve dirty migration state (if any)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # If a previous migration run failed and left the DB dirty, force-reset to
        # the last known-good version so `migrate up` can continue cleanly.
        # The force version (7) is the last successfully applied migration before
        # the commission table FK bug (version 8). Once all migrations are clean
        # this step becomes a safe no-op when the DB is not dirty.
        run: |
          DIRTY=$(migrate -path db/migrations -database "$DATABASE_URL" version 2>&1 || true)
          echo "Current migration state: $DIRTY"
          if echo "$DIRTY" | grep -q "dirty"; then
            echo "Dirty state detected — forcing to version 7 (last clean migration)"
            migrate -path db/migrations -database "$DATABASE_URL" force 7
          fi

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          migrate -path db/migrations -database "$DATABASE_URL" up
          echo "Migration complete"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: migrate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build release binary
        run: |
          CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o balam-api .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: balam-api
          path: balam-api
          retention-days: 7
