  # ── Admin ─────────────────────────────────────────────────────────────────
  /v1/admin/import-sql:
    post:
      tags: [Admin]
      summary: Import a full seed SQL file (includes TRUNCATE)
      description: |
        Accepts the SQL file generated by the Balam migration script.
        File may contain `TRUNCATE`, `INSERT`, `SELECT setval()`, `BEGIN`, and `COMMIT`.
        All other statement types (DROP, ALTER, CREATE, etc.) are rejected.
        Max file size: 50 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Import complete
        '403':
          description: File contains disallowed SQL statements
        '413':
          description: File exceeds 50 MB limit
        '422':
          description: SQL execution failed (check server logs)
