      responses:
        '200':
          description: Family list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:  { type: array, items: { $ref: '#/components/schemas/FamilyListItem' } }
                  total: { type: integer }
                  page:  { type: integer }
                  limit: { type: integer }
