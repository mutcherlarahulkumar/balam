        - name: overdueDays
          in: query
          description: Only include policies overdue by at least this many days
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Due policies
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/FUPDueItem' } }

  /v1/fup/update:
    post:
      tags: [FUP]
      summary: Update the next premium (FUP) date on a policy
      description: |
        `oldFup` must match the current `nextPremium` on the policy. Both history tables
        (`fuphistory` and `fupupdate`) are written atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateFUPRequest' }
      responses:
        '200':
          description: FUP updated
        '404':
          description: Policy not found
        '422':
          description: oldFup does not match current next premium
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: "fup_mismatch", message: "Provided oldFup does not match the current next premium on the policy" }

