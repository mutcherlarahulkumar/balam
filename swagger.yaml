openapi: 3.0.3
info:
  title: Balam LIC Agent CRM API
  version: 1.0.0
  description: |
    REST API for the Balam LIC Agent CRM mobile/web application.

    **Authentication**: All routes except `/v1/auth/login` and `/v1/auth/register`
    require a Bearer JWT in the `Authorization` header.

    **Error format**: Every error response uses the same envelope:
    ```json
    { "error": "error_code", "message": "Human readable message." }
    ```
    Validation errors use a different shape:
    ```json
    { "error": "validation_error", "errors": [{ "field": "email", "message": "email is required." }] }
    ```

servers:
  - url: /v1
    description: Versioned API

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ── Errors ──────────────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        error:   { type: string, example: "invalid_credentials" }
        message: { type: string, example: "Email/agent code or password is incorrect." }

    ValidationErrorResponse:
      type: object
      properties:
        error: { type: string, example: "validation_error" }
        errors:
          type: array
          items:
            type: object
            properties:
              field:   { type: string, example: "email" }
              message: { type: string, example: "email must be a valid email address." }

    # ── Agent / Auth ─────────────────────────────────────────────────────────
    AgentPublic:
      type: object
      properties:
        id:          { type: integer }
        name:        { type: string }
        agentCode:   { type: string, description: "LIC agent code (login column)" }
        branch:      { type: string }
        club:        { type: string }
        licenceNo:   { type: string }
        agSince:     { type: string, format: date-time, nullable: true }
        renewalDate: { type: string, format: date-time, nullable: true }
        pan:         { type: string }
        mobile:      { type: string }
        email:       { type: string }
        photo:       { type: string }
        slogan:      { type: string }
        newPortal:   { type: boolean }

    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: "Agent code OR email address"
          example: "0045269T"
        password:
          type: string
          minLength: 6
          example: "Lic@8074"

    LoginResponse:
      type: object
      properties:
        token:     { type: string }
        expiresAt: { type: string, format: date-time }
        agent:     { $ref: '#/components/schemas/AgentPublic' }

    RegisterRequest:
      type: object
      required: [name, email, agentCode, password, branch, mobile, licenceNo]
      properties:
        name:      { type: string, minLength: 2, maxLength: 80 }
        email:     { type: string, format: email }
        agentCode: { type: string, minLength: 3, maxLength: 20, description: "LIC agent code e.g. 0045269T" }
        password:  { type: string, minLength: 8, maxLength: 72 }
        branch:    { type: string, minLength: 2, maxLength: 20 }
        mobile:    { type: string, minLength: 10, maxLength: 10, pattern: "^[0-9]{10}$" }
        licenceNo: { type: string, minLength: 3, maxLength: 100 }

    RefreshResponse:
      type: object
      properties:
        token:     { type: string }
        expiresAt: { type: string, format: date-time }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword:     { type: string, minLength: 8 }

    UpdateProfileRequest:
      type: object
      properties:
        name:    { type: string, minLength: 2, maxLength: 80 }
        mobile:  { type: string, minLength: 10, maxLength: 15 }
        email:   { type: string, format: email }
        photo:   { type: string }
        slogan:  { type: string, maxLength: 200 }
        address: { type: string, maxLength: 200 }

    # ── Family ───────────────────────────────────────────────────────────────
    Family:
      type: object
      properties:
        id:          { type: integer }
        familyCode:  { type: string }
        headName:    { type: string }
        address:     { type: string }
        email:       { type: string }
        mobile:      { type: string }
        pincode:     { type: string }
        religion:    { type: string }
        designation: { type: string }
        lastUpdate:  { type: string, format: date-time, nullable: true }

    FamilyListItem:
      type: object
      properties:
        id:          { type: integer }
        familyCode:  { type: string }
        headName:    { type: string }
        mobile:      { type: string }
        address:     { type: string }
        pincode:     { type: string }
        memberCount: { type: integer }
        policyCount: { type: integer }

    FamilyDetail:
      allOf:
        - $ref: '#/components/schemas/Family'
        - type: object
          properties:
            members:  { type: array, items: { $ref: '#/components/schemas/Client' } }
            policies: { type: array, items: { $ref: '#/components/schemas/PolicyListItem' } }

    CreateFamilyRequest:
      type: object
      required: [headName]
      properties:
        familyCode:  { type: string, maxLength: 15 }
        headName:    { type: string, minLength: 2, maxLength: 80 }
        address:     { type: string, maxLength: 250 }
        mobile:      { type: string, minLength: 10, maxLength: 15 }
        email:       { type: string, format: email }
        pincode:     { type: string, maxLength: 10 }
        religion:    { type: string, maxLength: 20 }
        designation: { type: string, maxLength: 80 }

    UpdateFamilyRequest:
      type: object
      properties:
        headName:    { type: string, minLength: 2, maxLength: 80 }
        address:     { type: string, maxLength: 250 }
        mobile:      { type: string, minLength: 10, maxLength: 15 }
        email:       { type: string, format: email }
        pincode:     { type: string, maxLength: 10 }
        religion:    { type: string, maxLength: 20 }
        designation: { type: string, maxLength: 80 }

    # ── Client ───────────────────────────────────────────────────────────────
    Client:
      type: object
      properties:
        id:         { type: integer }
        familyCode: { type: string }
        persCode:   { type: string }
        name:       { type: string }
        mobile:     { type: string }
        dob:        { type: string, format: date-time, nullable: true }
        sex:        { type: string, enum: [M, F, O] }
        address:    { type: string }
        email:      { type: string }
        occupation: { type: string }
        age:        { type: integer }
        clientType: { type: string, enum: [C, P, N], description: "C=Customer, P=Prospect, N=New" }
        comment:    { type: string }
        source:     { type: string }
        city:       { type: string }
        state:      { type: string }

    ClientDetail:
      allOf:
        - $ref: '#/components/schemas/Client'
        - type: object
          properties:
            policies:    { type: array, items: { $ref: '#/components/schemas/PolicyListItem' } }
            bankDetails: { type: array, items: { $ref: '#/components/schemas/BankDetail' } }
            documents:   { type: array, items: { $ref: '#/components/schemas/Document' } }

    CreateClientRequest:
      type: object
      required: [familyCode, persCode, name]
      properties:
        familyCode:  { type: string, maxLength: 15 }
        persCode:    { type: string, maxLength: 10 }
        name:        { type: string, minLength: 2, maxLength: 80 }
        dob:         { type: string, format: date, example: "1990-05-15" }
        sex:         { type: string, enum: [M, F, O] }
        mobile:      { type: string, minLength: 10, maxLength: 15 }
        email:       { type: string, format: email }
        occupation:  { type: string, maxLength: 50 }
        clientType:  { type: string, enum: [C, P, N] }
        address:     { type: string, maxLength: 255 }

    UpdateClientRequest:
      type: object
      properties:
        name:       { type: string, minLength: 2, maxLength: 80 }
        dob:        { type: string, format: date }
        sex:        { type: string, enum: [M, F, O] }
        mobile:     { type: string, minLength: 10, maxLength: 15 }
        email:      { type: string, format: email }
        occupation: { type: string, maxLength: 50 }
        clientType: { type: string, enum: [C, P, N] }
        address:    { type: string, maxLength: 255 }

    BankDetail:
      type: object
      properties:
        id:            { type: integer }
        clientId:      { type: integer }
        bankName:      { type: string }
        accountNumber: { type: string }
        ifseCode:      { type: string }
        micrCode:      { type: string }
        familyCode:    { type: string }
        persCode:      { type: string }
        aadhar:        { type: string, description: "Decrypted at response time" }
        pan:           { type: string }
        ckyc:          { type: string }

    Document:
      type: object
      properties:
        id:       { type: integer }
        clientId: { type: integer }
        policyNo: { type: integer }
        title:    { type: string }
        photo:    { type: string }
        profile:  { type: boolean }

    # ── Plan ─────────────────────────────────────────────────────────────────
    Plan:
      type: object
      properties:
        planNo:    { type: string }
        planName:  { type: string }
        planType:  { type: string }
        termPpt:   { type: boolean }
        sbSchedule:
          type: array
          items:
            type: object
            properties:
              year:       { type: integer }
              benefitPct: { type: number }
        stax:     { type: string }
        lapsDays: { type: integer }
        gstRates:
          type: object
          properties:
            firstYear: { type: number }
            renewal:   { type: number }
            note:      { type: string }

    # ── Policy ───────────────────────────────────────────────────────────────
    PolicyListItem:
      type: object
      properties:
        id:             { type: integer }
        policyNo:       { type: integer }
        familyCode:     { type: string }
        clientName:     { type: string }
        planNo:         { type: string }
        planName:       { type: string }
        term:           { type: integer }
        ppt:            { type: integer }
        premium:        { type: number }
        sumAssured:     { type: number }
        paymentMode:    { type: string, enum: [Y, H, Q, M, S] }
        nextPremium:    { type: string, format: date-time, nullable: true }
        matDate:        { type: string, format: date-time, nullable: true }
        status:         { type: string, enum: [IF, LA, PU, SU, MA, CL, EX] }
        fupStatus:      { type: string, enum: [PAID, DUE, OVERDUE, LAPSED] }
        daysUntilLapse: { type: integer }

    Policy:
      type: object
      properties:
        id:          { type: integer }
        policyNo:    { type: integer }
        familyCode:  { type: string }
        persCode:    { type: string }
        issueDate:   { type: string, format: date-time, nullable: true }
        matDate:     { type: string, format: date-time, nullable: true }
        paymentMode: { type: string, enum: [Y, H, Q, M, S] }
        premium:     { type: number }
        sumAssured:  { type: number }
        plan:        { type: integer }
        planName:    { type: string }
        term:        { type: integer }
        ppt:         { type: integer }
        nextPremium: { type: string, format: date-time, nullable: true }
        matAmount:   { type: number }
        nominee:     { type: string }
        relation:    { type: string }
        agCode:      { type: string }
        statCd:      { type: string }
        status:
          type: string
          enum: [IF, LA, PU, SU, MA, CL, EX]
          description: |
            IF=In Force, LA=Lapsed, PU=Paid-Up, SU=Surrendered,
            MA=Matured, CL=Claim, EX=Expired
        fupStatus:   { type: string, enum: [PAID, DUE, OVERDUE, LAPSED] }
        age:         { type: integer }
        lastPaid:    { type: string, format: date-time, nullable: true }
        neft:        { type: string }
        lastFup:     { type: string, format: date-time, nullable: true }
        branch:      { type: string }
        dab:         { type: integer }
        termRider:   { type: integer }

    PolicyDetail:
      allOf:
        - $ref: '#/components/schemas/Policy'
        - type: object
          properties:
            fupHistory: { type: array, items: { $ref: '#/components/schemas/FUPHistory' } }
            loans:      { type: array, items: { $ref: '#/components/schemas/Loan' } }
            sbRecords:  { type: array, items: { $ref: '#/components/schemas/SB' } }

    CreatePolicyRequest:
      type: object
      required: [policyNo, familyCode, persCode, planNo, issueDate, matDate, term, ppt, sumAssured, premium, paymentMode, nextPremium, nominee, relation]
      properties:
        policyNo:    { type: integer }
        familyCode:  { type: string }
        persCode:    { type: string }
        planNo:      { type: string }
        issueDate:   { type: string, format: date, example: "2020-04-01" }
        matDate:     { type: string, format: date, example: "2040-04-01" }
        term:        { type: integer, minimum: 1 }
        ppt:         { type: integer, minimum: 1 }
        sumAssured:  { type: number, exclusiveMinimum: 0 }
        premium:     { type: number, exclusiveMinimum: 0 }
        paymentMode: { type: string, enum: [Y, H, Q, M, S] }
        nextPremium: { type: string, format: date }
        nominee:     { type: string, maxLength: 80 }
        relation:    { type: string, maxLength: 20 }
        branch:      { type: string, maxLength: 15 }
        neft:        { type: string, enum: [YES, NO] }
        dab:         { type: integer, minimum: 0 }
        termRider:   { type: integer, minimum: 0 }

    UpdatePolicyRequest:
      type: object
      properties:
        status:      { type: string, enum: [IF, LA, PU, SU, MA, CL, EX] }
        nominee:     { type: string, maxLength: 80 }
        relation:    { type: string, maxLength: 20 }
        neft:        { type: string, enum: [YES, NO] }
        nextPremium: { type: string, format: date }
        fupStatus:   { type: string }

    # ── FUP ──────────────────────────────────────────────────────────────────
    FUPDueItem:
      type: object
      properties:
        policyNo:       { type: integer }
        clientName:     { type: string }
        mobile:         { type: string }
        planName:       { type: string }
        premium:        { type: number }
        nextPremium:    { type: string, format: date-time, nullable: true }
        paymentMode:    { type: string }
        daysOverdue:    { type: integer }
        lapseDate:      { type: string, format: date-time, nullable: true }
        daysUntilLapse: { type: integer }

    FUPHistory:
      type: object
      properties:
        id:        { type: integer }
        policyNo:  { type: integer }
        oldFup:    { type: string, format: date-time, nullable: true }
        newFup:    { type: string, format: date-time, nullable: true }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time, nullable: true }

    MultipleDue:
      type: object
      properties:
        id:       { type: integer }
        policyNo: { type: integer }
        dueDate:  { type: string, format: date-time, nullable: true }
        instNo:   { type: integer }
        intAmt:   { type: number }
        validUpto:{ type: string, format: date-time, nullable: true }
        totalAmt: { type: number }

    UpdateFUPRequest:
      type: object
      required: [policyNo, oldFup, newFup]
      properties:
        policyNo: { type: integer }
        oldFup:   { type: string, format: date, example: "2024-04-01" }
        newFup:   { type: string, format: date, example: "2025-04-01" }
        reason:   { type: string, maxLength: 500 }

    # ── Commission ───────────────────────────────────────────────────────────
    Commission:
      type: object
      properties:
        id:         { type: integer }
        policyNo:   { type: integer }
        billDate:   { type: string, format: date-time, nullable: true }
        firstComm:  { type: number }
        secondComm: { type: number }
        thirdComm:  { type: number }
        bonusComm:  { type: number }
        singleComm: { type: number }
        subComm:    { type: number }
        payDate:    { type: string, format: date-time, nullable: true }

    CreateCommissionRequest:
      type: object
      required: [policyNo, billDate]
      properties:
        policyNo:   { type: integer }
        billDate:   { type: string, format: date, example: "2024-04-01" }
        firstComm:  { type: number, minimum: 0 }
        secondComm: { type: number, minimum: 0 }
        thirdComm:  { type: number, minimum: 0 }
        bonusComm:  { type: number, minimum: 0 }
        singleComm: { type: number, minimum: 0 }
        payDate:    { type: string, format: date }

    CommissionSummary:
      type: object
      properties:
        currentMonth:
          type: object
          properties:
            month:           { type: string, example: "2024-04" }
            totalCommission: { type: number }
            policiesBilled:  { type: integer }
        yearly:
          type: array
          items:
            type: object
            properties:
              year:      { type: integer }
              firstYear: { type: number }
              renewal:   { type: number }
              bonus:     { type: number }
              gross:     { type: number }

    CommissionEstimate:
      type: object
      properties:
        policyNo:            { type: integer }
        premium:             { type: number }
        planNo:              { type: string }
        year:                { type: integer }
        baseCommissionPct:   { type: number }
        bonusCommissionPct:  { type: number }
        totalPct:            { type: number }
        estimatedCommission: { type: number }
        note:                { type: string }

    # ── GST ──────────────────────────────────────────────────────────────────
    GSTCalculateResponse:
      type: object
      properties:
        policyNo:       { type: integer }
        planNo:         { type: string }
        planType:       { type: string }
        basePremium:    { type: number }
        premiumYear:    { type: integer }
        gstRate:        { type: number }
        gstAmount:      { type: number }
        totalPremium:   { type: number }
        regulation:     { type: string }
        historicalNote: { type: string }

    # ── Loan ─────────────────────────────────────────────────────────────────
    Loan:
      type: object
      properties:
        id:              { type: integer }
        policyNo:        { type: integer }
        loanDate:        { type: string, format: date-time, nullable: true }
        loanAmount:      { type: integer }
        interestDueDate: { type: string, format: date-time, nullable: true }
        loanInterest:    { type: integer }
        details:         { type: string }

    CreateLoanRequest:
      type: object
      required: [policyNo, loanDate, loanAmount, interestDueDate]
      properties:
        policyNo:       { type: integer }
        loanDate:       { type: string, format: date, example: "2024-01-15" }
        loanAmount:     { type: integer, exclusiveMinimum: 0 }
        interestDueDate:{ type: string, format: date }
        loanInterest:   { type: integer, minimum: 0 }

    # ── SB ───────────────────────────────────────────────────────────────────
    SB:
      type: object
      properties:
        id:           { type: integer }
        policyNo:     { type: integer }
        sbDueDate:    { type: string, format: date-time, nullable: true }
        sbAmount:     { type: number }
        instalmentNo: { type: integer }
        sbPayDate:    { type: string, format: date-time, nullable: true, description: "null if not yet paid" }
        chequeNo:     { type: string }
        details:      { type: string }

    CreateSBRequest:
      type: object
      required: [policyNo, sbDueDate, sbAmount, instalmentNo]
      properties:
        policyNo:     { type: integer }
        sbDueDate:    { type: string, format: date, example: "2026-04-01" }
        sbAmount:     { type: number, exclusiveMinimum: 0 }
        instalmentNo: { type: integer, minimum: 1 }

    MarkSBPaidRequest:
      type: object
      required: [paidDate]
      properties:
        paidDate: { type: string, format: date, example: "2026-04-05" }
        chequeNo: { type: string, maxLength: 10 }

    # ── Lead / Activity ───────────────────────────────────────────────────────
    Lead:
      type: object
      properties:
        id:         { type: integer }
        leadId:     { type: string }
        searchTerm: { type: string }
        name:       { type: string }
        mobile:     { type: string }
        address:    { type: string }
        status:     { type: integer }
        dateAdded:  { type: string, format: date-time, nullable: true }

    CreateLeadRequest:
      type: object
      required: [name, mobile]
      properties:
        name:       { type: string, minLength: 2, maxLength: 150 }
        mobile:     { type: string, minLength: 10, maxLength: 15 }
        address:    { type: string, maxLength: 500 }
        searchTerm: { type: string, maxLength: 100 }

    Activity:
      type: object
      properties:
        id:           { type: integer }
        clientId:     { type: integer }
        activityDate: { type: string, format: date-time, nullable: true }
        activityTime: { type: string, format: date-time, nullable: true }
        activityType: { type: string }
        details:      { type: string }
        reminderDate: { type: string, format: date-time, nullable: true }
        reminderTime: { type: string, format: date-time, nullable: true }
        status:       { type: string }

    CreateActivityRequest:
      type: object
      required: [clientId, activityType, activityDate]
      properties:
        clientId:
          type: integer
        activityType:
          type: string
          enum: [CALL, MEETING, DEMO, EMAIL, PROPOSAL, MEDICAL, REMINDER]
        activityDate: { type: string, format: date, example: "2024-04-15" }
        activityTime: { type: string, example: "14:30" }
        details:      { type: string, maxLength: 1000 }
        reminderDate: { type: string, format: date }
        reminderTime: { type: string }
        status:       { type: string, enum: [PENDING, DONE, CANCELLED] }

    # ── Reports ───────────────────────────────────────────────────────────────
    ReportCashflow:
      type: object
      properties:
        familyCode: { type: string }
        persCode:   { type: string }
        policyNo:   { type: string }
        dueDate:    { type: string }
        name:       { type: string }
        age:        { type: integer }
        sbAmount:   { type: number }
        bonus:      { type: number }
        total:      { type: number }
        type:       { type: string, enum: [SB, MAT] }

    ReportCashInOut:
      type: object
      properties:
        year:      { type: integer }
        cashInMat: { type: number }
        cashInSB:  { type: number }
        cashOut:   { type: number }
        netAmt:    { type: number }

    ReportCurrentStatus:
      type: object
      properties:
        familyCode:  { type: string }
        persCode:    { type: string }
        policyNo:    { type: string }
        dueStatus:   { type: string }
        premiumPaid: { type: number }
        vestedBonus: { type: number }
        surrValue:   { type: number }
        loanTaken:   { type: number }
        loanDate:    { type: string }
        loanAmt:     { type: number }

    ReportCalendar:
      type: object
      properties:
        familyCode: { type: string }
        persCode:   { type: string }
        policyNo:   { type: string }
        jan:  { type: number }
        feb:  { type: number }
        mar:  { type: number }
        apr:  { type: number }
        may:  { type: number }
        jun:  { type: number }
        jul:  { type: number }
        aug:  { type: number }
        sep:  { type: number }
        oct:  { type: number }
        nov:  { type: number }
        dec:  { type: number }

security:
  - bearerAuth: []

paths:
  # ── Health ────────────────────────────────────────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: Liveness check
      security: []
      responses:
        '200':
          description: Server is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }

  # ── Auth ──────────────────────────────────────────────────────────────────
  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with agent code or email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: Invalid credentials / account locked / terminated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                invalid_credentials:
                  value: { error: "invalid_credentials", message: "Email/agent code or password is incorrect." }
                account_locked:
                  value: { error: "account_locked", message: "Account is temporarily locked due to too many failed login attempts. Try again in 15 minutes." }
                account_terminated:
                  value: { error: "account_terminated", message: "This agent account has been terminated." }

  /v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new agent account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:  { type: string }
                  agentId:  { type: integer }
        '400':
          description: Validation errors
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationErrorResponse' }
        '409':
          description: Email or agent code already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                email_taken:
                  value: { error: "email_taken", message: "An account with this email already exists." }
                agent_code_taken:
                  value: { error: "agent_code_taken", message: "An account with this agent code already exists." }

  /v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Issue a new JWT for the current session
      responses:
        '200':
          description: New token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshResponse' }

  /v1/auth/change-password:
    post:
      tags: [Auth]
      summary: Change the authenticated agent's password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400':
          description: Wrong current password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ── Agent Profile ─────────────────────────────────────────────────────────
  /v1/agent/profile:
    get:
      tags: [Agent]
      summary: Get the authenticated agent's profile
      responses:
        '200':
          description: Agent profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentPublic' }
    put:
      tags: [Agent]
      summary: Update agent profile fields
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  # ── Agent Import ──────────────────────────────────────────────────────────
  /v1/agent/import:
    post:
      tags: [Agent]
      summary: Reset all data and import from INSERT-only SQL file
      description: |
        Clears all existing records from every table (agent, policies, clients, families, etc.)
        then executes the uploaded SQL file.

        **The file must contain only `INSERT` and `SELECT setval()` statements — do NOT include
        `TRUNCATE` or `BEGIN/COMMIT`. The server handles clearing automatically.**

        Use the Python script from the migration guide to generate a compatible file from
        the Android SQLite backup.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: "INSERT-only .sql file (max 50 MB)"
      responses:
        '200':
          description: Import complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  file:    { type: string }
        '403':
          description: File contains disallowed SQL (e.g. TRUNCATE, DROP)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: SQL execution failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

